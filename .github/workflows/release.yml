# 打 v* 标签时：构建正式签名的 Android APK + Windows / Linux / macOS 安装包，上传到 Release
name: Release

on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许把产物发布到 GitHub Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装依赖
        run: npm ci

      # 从 package.json 读版本号，同步到 android/app/build.gradle
      - name: 同步版本号
        run: node scripts/sync-android-version.mjs

      # GitHub 的 runner 在境外，恢复官方 gradle 发行地址（本地改过的镜像不影响仓库）
      - name: 恢复官方 Gradle 发行地址
        run: |
          python3 - <<'EOF'
          import io
          p = 'android/gradle/wrapper/gradle-wrapper.properties'
          s = io.open(p, encoding='utf-8').read()
          s = s.replace('mirrors.cloud.tencent.com/gradle', 'services.gradle.org/distributions')
          io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
          EOF

      - name: 构建 Web 资源并同步到 Android 工程
        run: |
          npm run build:web
          npx cap sync android

      - name: 写入签名信息
        run: |
          set -euo pipefail
          mkdir -p "$HOME/keystore"
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > "$HOME/keystore/tomato-todo-release.keystore"
          test -s "$HOME/keystore/tomato-todo-release.keystore"
          cat > android/release-signing.properties <<EOF
          storeFile=$HOME/keystore/tomato-todo-release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          chmod 600 android/release-signing.properties "$HOME/keystore/tomato-todo-release.keystore"
          # 使用绝对路径；不能用 rootProject.file('../...')（那是仓库根目录，
          # 不是 android/，会静默回退成每次不同的 debug 签名）。
          echo "TOMATO_RELEASE_SIGNING_PROPERTIES=$GITHUB_WORKSPACE/android/release-signing.properties" >> "$GITHUB_ENV"

      - name: 构建 release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 重命名产物（带版本号）
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp android/app/build/outputs/apk/release/app-release.apk "tomato-todo-v${VERSION}-release.apk"
          ls -la tomato-todo-v*-release.apk

      - name: 校验正式签名（必须与 Secret 中 keystore 一致）
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK="tomato-todo-v${GITHUB_REF_NAME#v}-release.apk"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          # apksigner 的行可能以 "V2 Signer: certificate ...: <hash>" 开头，
          # 取最后一个字段，而不是第二个字段（第二个是 certificate 标签）。
          ACTUAL=$(printf '%s\n' "$CERTS" | awk -F': ' '/certificate SHA-256 digest:/{print $NF; exit}')
          EXPECTED=$(keytool -exportcert \
            -keystore "$HOME/keystore/tomato-todo-release.keystore" \
            -alias '${{ secrets.KEY_ALIAS }}' \
            -storepass '${{ secrets.KEYSTORE_PASSWORD }}' 2>/dev/null | sha256sum | cut -d' ' -f1)
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: APK signing certificate ($ACTUAL) does not match release keystore ($EXPECTED); refusing to publish." >&2
            exit 1
          fi
          echo "Release APK certificate SHA-256 verified: $ACTUAL"

      - name: 发布产物与说明
        uses: ./.github/actions/publish-release
        with:
          files: tomato-todo-v*-release.apk
          artifact-name: tomato-todo-apk
          artifact-path: tomato-todo-v*-release.apk

  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建主进程 / 渲染层 / MCP 入口
        run: npm run build

      - name: 构建 NSIS 安装包
        run: npx electron-builder --win --publish never
        env:
          # CI 上缓存 Electron 构建依赖
          USE_HARD_LINKS: 'false'

      - name: 重命名产物（带版本号）
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist-win
          # GitHub 会规范化资产文件名（中文/空格会被改写），统一改成 ASCII 名
          for f in release/*.exe; do
            [ -e "$f" ] || continue
            cp "$f" "dist-win/tomato-todo-setup-${VERSION}.exe"
          done
          ls -la dist-win/

      - name: 发布产物与说明
        uses: ./.github/actions/publish-release
        with:
          files: dist-win/*.exe
          artifact-name: tomato-todo-windows
          artifact-path: dist-win/*.exe

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建主进程 / 渲染层 / MCP 入口
        run: npm run build

      # AppImage / deb / rpm 三格式（deb/rpm 需在 Linux 上打包）
      - name: 构建 Linux 发行包
        run: npx electron-builder --linux --publish never
        env:
          USE_HARD_LINKS: 'false'

      - name: 整理产物
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist-linux
          # 通配符放宽到 tomato-todo*，兼容连字符/下划线两种产物命名
          cp release/tomato-todo*"${VERSION}"* dist-linux/ 2>/dev/null || true
          ls -la dist-linux/

      - name: 发布产物与说明
        uses: ./.github/actions/publish-release
        with:
          files: dist-linux/*
          artifact-name: tomato-todo-linux
          artifact-path: dist-linux/*

  macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建主进程 / 渲染层 / MCP 入口
        run: npm run build

      # x64 + arm64 双架构 dmg；无签名证书时出未签名包，用户首次右键打开
      - name: 构建 macOS dmg
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 整理产物
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist-mac
          cp release/tomato-todo-*"${VERSION}"*.dmg dist-mac/ 2>/dev/null || true
          ls -la dist-mac/

      - name: 发布产物与说明
        uses: ./.github/actions/publish-release
        with:
          files: dist-mac/*
          artifact-name: tomato-todo-macos
          artifact-path: dist-mac/*
